<!DOCTYPE html>
<html lang="es" data-mode="public"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablero de pacientes Fresenius Kabi · P2D</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef2f8;--card:#fff;--ink:#14213d;--mut:#5b6784;--line:#dbe2ee;--b1:#0063be;--b2:#1f2f7a;--b3:#5b9bd8;--warn:#e07b00;--ok:#1a8f5a}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0d1526;--card:#16213a;--ink:#e8eefb;--mut:#9aa8c7;--line:#26365a;--b1:#4d9bea;--b2:#8fa4ff;--b3:#2d6fb0}}
:root[data-theme=dark]{--bg:#0d1526;--card:#16213a;--ink:#e8eefb;--mut:#9aa8c7;--line:#26365a;--b1:#4d9bea;--b2:#8fa4ff;--b3:#2d6fb0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif}
header{background:#fff;border-bottom:3px solid var(--b1);display:flex;align-items:center;gap:20px;padding:12px 24px;flex-wrap:wrap}
header img{height:40px;max-width:100%}header .t{flex:1;min-width:220px;color:#14213d}header h1{margin:0;font-size:20px;font-weight:700}header p{margin:0;font-size:12px;color:#5b6784}
main{max-width:1400px;margin:0 auto;padding:16px 24px 40px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.bar label{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:3px;min-width:130px;flex:1}
select,input[type=search],button{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button{cursor:pointer;background:var(--b1);color:#fff;border-color:var(--b1);font-weight:600}button.g{background:transparent;color:var(--b1)}
:focus-visible{outline:2px solid var(--b1);outline-offset:2px}
.seg{display:flex}.seg button{border-radius:0;background:transparent;color:var(--b1)}.seg button.on{background:var(--b1);color:#fff}.seg button:first-child{border-radius:6px 0 0 6px}.seg button:last-child{border-radius:0 6px 6px 0}
.adm{margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--card);border:1px dashed var(--b1);border-radius:8px;padding:10px 12px}
.adm span{color:var(--mut);font-size:12px;flex:1;min-width:200px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}
.k{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--b1);border-radius:8px;padding:10px 14px}.k b{display:block;font-size:26px;font-weight:700;color:var(--b2);letter-spacing:-.5px}.k small{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:12px}
.c{background:var(--card);border:3px solid #0e8c94;border-radius:6px;padding:14px;min-width:0}.c h2{margin:0 0 10px;font-size:16px;font-weight:500}.w{grid-column:1/-1}
.r{display:grid;grid-template-columns:minmax(90px,38%) 1fr auto;gap:8px;align-items:center;padding:3px 4px;border-radius:4px;cursor:pointer;font-size:12.5px}.r:hover,.r.on{background:var(--bg)}
.r i{display:block;height:12px;border-radius:2px;background:var(--b1)}.r.on i{background:var(--warn)}.r span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.r em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--mut)}
.tw{overflow-x:auto;max-height:460px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:var(--card);color:var(--mut)}
svg text{fill:var(--mut);font-size:10px}.msg{font-size:12px;color:var(--warn)}
.dr{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:12px}.dc{background:var(--card);border:3px solid #0e8c94;border-radius:6px;padding:12px;min-width:0}.dc h2{font-size:16px;font-weight:500;margin:0 0 6px}.dcb{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.dcb svg{width:190px;flex:none}.dcb div{flex:1;min-width:120px}.lg{display:flex;gap:6px;align-items:center;font-size:12px;cursor:pointer;padding:1px 3px;border-radius:3px}.lg:hover,.lg.on{background:var(--bg)}.lg b{width:10px;height:10px;border-radius:50%;flex:none}.lg span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sl{cursor:pointer}.sl.on{stroke:var(--warn);stroke-width:3}
[hidden]{display:none!important}
</style></head><body>

$('#bar').innerHTML=FL.map(c=>`<label>${c}<select data-c="${c}"><option value="">Todos</option>${[...new Set(ROWS.map(r=>r[c]).filter(Boolean))].sort((a,b)=>{const k=v=>c=='Fecha MIPRES'?ROWS.find(r=>r[c]==v).mes:v;return k(a)<k(b)?-1:1}).map(v=>`<option>${esc(v)}</option>`).join('')}</select></label>`).join('')+`<button class="g" id="rs">Limpiar filtros</button>`;
document.querySelectorAll('#bar select').forEach(s=>s.onchange=()=>{F[s.dataset.c]=s.value;draw()});

$('#rs').onclick=()=>{F={};document.querySelectorAll('#bar select').forEach(s=>s.value='');draw()};draw()}
const val=r=>M=='t'?1:r.ent,fmt=v=>M=='t'?n0(v):n0(v);
function grp(rows,fn){const m=new Map();rows.forEach(r=>{const k=fn(r)||'Sin dato';m.set(k,(m.get(k)||0)+val(r))});return[...m].sort((a,b)=>b[1]-a[1])}
function hb(t,rows,fn,n,col){const g=grp(rows,fn),mx=g[0]?g[0][1]:1;return`<div class="c"><h2>${t}</h2>${g.slice(0,n).map(([k,v])=>`<div class="r${col&&F[col]==k?' on':''}" ${col?`data-c="${col}" data-v="${esc(k)}"`:''} title="${esc(k)}: ${n0(v)}"><span>${esc(k)}</span><i style="width:${Math.max(2,v/mx*100)}%"></i><em>${fmt(v)}</em></div>`).join('')}</div>`}
function trend(rows){const g=grp(rows,r=>r.mes).filter(x=>x[0]!='Sin fecha').sort((a,b)=>a[0]<b[0]?-1:1),mx=Math.max(1,...g.map(x=>x[1])),w=700/Math.max(g.length,1);
return`<div class="c w"><h2>Evolución mensual por fecha de MIPRES</h2><svg viewBox="0 0 700 200" width="100%" role="img" aria-label="Evolución mensual">${g.map(([k,v],i)=>{const h=v/mx*150;return`<rect x="${i*w+w*.15}" y="${170-h}" width="${w*.7}" height="${h}" fill="var(--b1)" rx="2"><title>${k}: ${n0(v)}</title></rect><text x="${i*w+w/2}" y="${165-h}" text-anchor="middle">${n0(v)}</text><text x="${i*w+w/2}" y="186" text-anchor="middle">${k.slice(2).replace('-','/')}</text>`}).join('')}</svg></div>`}
const PAL=['#00b0e6','#0a9be3','#0a76b0','#1a4fa3','#1e6fe6','#5a4ef0','#6a35c9','#8a3fa0','#7a0f9a','#4a1d5a'];
function dn(t,rows,fn,col){const g=grp(rows,fn),tot=g.reduce((a,x)=>a+x[1],0)||1,R=90,r=52,c=100,p=(q,a)=>[c+q*Math.cos(a),c+q*Math.sin(a)];let a0=-Math.PI/2;
const sl=g.map(([k,v],i)=>{const f=v/tot,a1=a0+Math.min(f,.99999)*2*Math.PI,[x0,y0]=p(R,a0),[x1,y1]=p(R,a1),[x2,y2]=p(r,a1),[x3,y3]=p(r,a0),lg=f>.5?1:0,[lx,ly]=p((R+r)/2,(a0+a1)/2);a0=a1;const on=F[col]==k?' on':'';
return`<path class="sl${on}" data-c="${col}" data-v="${esc(k)}" fill="${PAL[i%PAL.length]}" d="M${x0} ${y0}A${R} ${R} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${lg} 0 ${x3} ${y3}Z"><title>${esc(k)}: ${n0(v)} (${(f*100).toFixed(1)}%)</title></path>`+(f>=.05?`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" style="fill:#fff;font-size:11px;font-weight:600;pointer-events:none">${(f*100).toFixed(1)}%</text>`:'')}).join('');
return`<div class="dc"><h2>${t}</h2><div class="dcb"><svg viewBox="0 0 200 200" role="img" aria-label="${t}">${sl}</svg><div>${g.map(([k,v],i)=>`<div class="lg${F[col]==k?' on':''}" data-c="${col}" data-v="${esc(k)}" title="${esc(k)}: ${n0(v)}"><b style="background:${PAL[i%PAL.length]}"></b><span>${esc(k)}</span></div>`).join('')}</div></div></div>`}
function draw(){let rows=ROWS.filter(r=>FL.every(c=>!F[c]||r[c]==F[c]));const rz=ROWS.filter(r=>['Zona','Año','Trimestre'].every(c=>!F[c]||r[c]==F[c])),T=rows.length,act=rows.filter(r=>r['Estado Paciente']=='ACTIVO').length,pr=rz.reduce((a,r)=>a+r.pres,0),en=rz.reduce((a,r)=>a+r.ent,0),ent=rows.filter(r=>/entregad|completa/i.test(r.Status)).length;
$('#sub').textContent=`${n0(ROWS.length)} tickets cargados · Fechas MIPRES: ${[...new Set(ROWS.map(r=>r.mes))].filter(x=>x!='Sin fecha').sort().slice(0,1)} a ${[...new Set(ROWS.map(r=>r.mes))].sort().filter(x=>x!='Sin fecha').pop()}`;
$('#kp').innerHTML=[[n0(T),'Tickets'],[n0(act),'Activos ('+(T?Math.round(act/T*100):0)+'%)'],[n0(new Set(rows.map(r=>r.IPS)).size),'IPS distintas'],[n0(pr),'Unidades prescritas (zona, año y trimestre)'],[n0(en),'Unidades entregadas (zona, año y trimestre)'],[(pr?Math.round(en/pr*100):0)+'%','Entregado vs prescrito (zona, año y trimestre)'],[(T?Math.round(ent/T*100):0)+'%','Tickets con entrega']].map(([b,s])=>`<div class="k"><b>${b}</b><small>${s}</small></div>`).join('');
$('#gr').innerHTML=`<div class="dr">${dn('Producto formulado',rows,r=>r.Producto,'Producto')}${dn('Tipo de presentación',rows,r=>r['Tipo Presentación'],'Tipo Presentación')}${dn('Participación por zona',rows,r=>r.Zona,'Zona')}</div>`+trend(rows)+hb('Por zona',rows,r=>r.Zona,6,'Zona')+hb('Por ámbito',rows,r=>r['Ámbito'],4,'Ámbito')+hb('Estado del paciente',rows,r=>r['Estado Paciente'],4,'Estado Paciente')+hb('Por producto',rows,r=>r.Producto,8,'Producto')+hb('Estado del trámite (Status)',rows,r=>r.Status,15,'Status')+hb('Top 10 EPS',rows,r=>r.EPS,10,'EPS')+hb('Top 10 ciudades',rows,r=>r.ciudad,10)+hb('Top 10 IPS',rows,r=>r.IPS,10)+hb('Top 10 operadores (OPL)',rows,r=>r.OPL,10)+hb('Por delegado médico (DM)',rows,r=>r.DM,10,'DM')+hb('Top 10 prescriptores',rows,r=>r.Prescriptor,10);
document.querySelectorAll('.r[data-c],.sl,.lg').forEach(e=>e.onclick=()=>{const c=e.dataset.c,v=e.dataset.v;F[c]=F[c]==v?'':v;document.querySelector(`select[data-c="${c}"]`).value=F[c];draw()});

if(!a[0]||!a[0].includes('Ticket')||!a[0].includes('Producto'))throw new Error('El archivo debe tener las mismas columnas del informe (Ticket, Producto, …).');AOA=a;load(a);$('#am').textContent='Datos actualizados: '+n0(a.length-1)+' tickets. Usa «Guardar en el artefacto» para conservarlos.';$('#am').style.color='var(--ok)';$('#sv').hidden=false}catch(x){$('#am').textContent=x.message;$('#am').style.color='var(--warn)'}};

const local=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=name;document.body.appendChild(a);a.click();a.remove();ok('Versión pública descargada.')};
